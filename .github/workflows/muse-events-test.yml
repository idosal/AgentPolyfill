# The Events polyfill for Muse Code (polyfills/events/muse, plugin mcp-events): its own bundle
# and hook, built into the Codex plugin folder beside the Codex bundle. On any change in its
# folder, in its files in the plugin folder, in the Codex form's sources it reuses unchanged, in
# the shared Events client, or in the fixture server its tests use:
# - a typecheck, and a rebuild of the Muse bundles that must equal the committed ones;
# - its tests (settings, the organisation-policy check, the typed watch and stop, the hook, the
#   inbox, the attach wake against a stand-in muse, the committed bundles, a copied plugin), on
#   Linux and macOS. No real muse and no model: a stand-in for `muse config status` and
#   `muse attach`.

name: "mcp-events for Muse Code: tests"

on:
  push:
    branches: ["**"]
    paths:
      - "polyfills/events/muse/**"
      - "polyfills/events/codex/src/**"
      - "polyfills/events/codex/package-lock.json"
      - "polyfills/events/codex/test/harness.ts"
      - "polyfills/events/codex/plugin/.muse-plugin/**"
      - "polyfills/events/codex/plugin/muse/**"
      - "polyfills/events/core/**"
      - "polyfills/events/pi/src/words.ts"
      - "polyfills/events/claude-code/test/fixture-events-server.ts"
      - ".github/workflows/muse-events-test.yml"
  # Pull requests from forks; a branch of this repository is checked by its
  # pushes (see the job's `if`), so each change runs once.
  pull_request:
    paths:
      - "polyfills/events/muse/**"
      - "polyfills/events/codex/src/**"
      - "polyfills/events/codex/package-lock.json"
      - "polyfills/events/codex/test/harness.ts"
      - "polyfills/events/codex/plugin/.muse-plugin/**"
      - "polyfills/events/codex/plugin/muse/**"
      - "polyfills/events/core/**"
      - "polyfills/events/pi/src/words.ts"
      - "polyfills/events/claude-code/test/fixture-events-server.ts"
      - ".github/workflows/muse-events-test.yml"

permissions:
  contents: read

concurrency:
  group: muse-events-test-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: polyfills/events/muse

jobs:
  test:
    name: tests (${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: npm ci
        working-directory: polyfills/events/core
      - run: npm ci
        working-directory: polyfills/events/codex
      - run: npm run typecheck
      # The Muse files are installed as committed, beside the Codex bundle: rebuild them,
      # and fail if that changed anything there.
      - name: Rebuild the Muse bundles; they must equal the committed ones
        run: |
          npm run build
          if [ -n "$(git status --porcelain -- ../codex/plugin/muse)" ]; then
            git status --porcelain -- ../codex/plugin/muse
            echo "::error::../codex/plugin/muse is not what the sources build: run npm run build in polyfills/events/muse and commit it"
            exit 1
          fi
      - run: npm test
