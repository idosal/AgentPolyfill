name: Muse Code and Grok Bot adapters
on:
  push:
    paths: &paths
      - 'polyfills/ard/**'
      - 'polyfills/events/**'
      - 'polyfills/server-cards/**'
      - 'polyfills/skills/**'
      - 'polyfills/tasks/**'
      - 'marketplace.json'
      - '.agents/plugins/marketplace.json'
      - 'tools/bundle-notices.mjs'
      - 'tools/muse-grok/**'
      - 'docs/muse-grok.md'
      - '.github/workflows/muse-grok-test.yml'
  pull_request:
    paths: *paths
permissions:
  contents: read
jobs:
  safety-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: "21"
      - name: Check host safety properties and their negative controls
        env:
          TLA2TOOLS: ${{ runner.temp }}/tla2tools.jar
        run: |
          curl --fail --location --retry 2 --output "$TLA2TOOLS" https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          node tools/muse-grok/model/check.mjs
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Install locked dependencies
        run: |
          for dir in skills/codex skills/core tasks/core events/core events/codex events/muse ard/codex server-cards/codex server-cards/grok-bot; do
            npm ci --prefix "polyfills/$dir"
          done
      - name: Verify bundles, types and discovery tests
        run: |
          node tools/muse-grok/build.mjs --check
          node tools/bundle-notices.mjs polyfills/skills/muse --esbuild-from polyfills/skills/codex --plugin plugin --entry src/reference.ts --bundle dist/server.mjs --check
          node tools/bundle-notices.mjs polyfills/tasks/muse --esbuild-from polyfills/skills/codex --plugin plugin --entry src/tasks.ts --bundle dist/server.mjs --check
          node tools/bundle-notices.mjs polyfills/events/muse --esbuild-from polyfills/skills/codex --plugin plugin --entry src/monitor.ts --entry src/helper.ts --entry src/muse-prompt-hook.ts --bundle 'dist/{server,inbox,user-prompt-submit}.mjs' --check
          node --test polyfills/events/muse/test/recurring.test.ts
          polyfills/skills/codex/node_modules/.bin/tsc -p tools/muse-grok
          for dir in ard/muse server-cards/muse server-cards/grok-bot; do
            npm --prefix "polyfills/$dir" run typecheck
            npm --prefix "polyfills/$dir" test
          done
      - name: Install the independent Tasks publisher
        run: |
          python3 -m venv "$RUNNER_TEMP/fastmcp"
          "$RUNNER_TEMP/fastmcp/bin/pip" install --quiet --require-hashes -r polyfills/tasks/codex/test/interop/requirements.txt
      - name: Exercise both packaged transports with FastMCP
        run: |
          "$RUNNER_TEMP/fastmcp/bin/python" polyfills/tasks/codex/test/interop/fastmcp_server.py 48763 > "$RUNNER_TEMP/fastmcp.log" 2>&1 &
          publisher=$!
          trap 'kill "$publisher" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            kill -0 "$publisher" || { cat "$RUNNER_TEMP/fastmcp.log"; exit 1; }
            if curl -s -o /dev/null --max-time 1 http://127.0.0.1:48763/mcp; then break; fi
            sleep 1
          done
          MUSE_GROK_FASTMCP_URL=http://127.0.0.1:48763/mcp node --test tools/muse-grok/integration.test.mjs
      - name: Install the five packages with Muse and verify the shared plugins in Codex
        run: |
          mkdir "$RUNNER_TEMP/muse-bin"
          curl --fail --location --retry 2 'https://lookaside.facebook.com/lookaside/muse/download/?channel=muse&version=1.4.25-R9361.1&file=muse-x86-linux' -o "$RUNNER_TEMP/muse-bin/muse"
          echo "c1b728fb9732503c5e1869e3ad2f2c9bdb5b2638fb4cf398d6e2c46aa6d8f94a  $RUNNER_TEMP/muse-bin/muse" | sha256sum --check
          chmod +x "$RUNNER_TEMP/muse-bin/muse"
          PATH="$RUNNER_TEMP/muse-bin:$PATH" node tools/muse-grok/marketplace.mjs --check
          npm install --prefix "$RUNNER_TEMP/codex" --no-audit --no-fund @openai/codex@0.172.0
          node tools/muse-grok/codex-ignores-muse.mjs --codex "$RUNNER_TEMP/codex/node_modules/.bin/codex"
      - name: Verify the install archive and private team upload
        run: |
          python3 tools/muse-grok/package.py --kit "$RUNNER_TEMP/kit.zip"
          python3 tools/muse-grok/package.py --kit "$RUNNER_TEMP/rebuilt.zip"
          cmp "$RUNNER_TEMP/kit.zip" "$RUNNER_TEMP/rebuilt.zip"
          unzip -q "$RUNNER_TEMP/kit.zip" -d "$RUNNER_TEMP/extracted"
          python3 "$RUNNER_TEMP/extracted/agentpolyfill-hosts/tools/muse-grok/package.py" "$RUNNER_TEMP/team.zip"
          unzip -t "$RUNNER_TEMP/team.zip"
          GROK_TEST_CLI="$RUNNER_TEMP/extracted/agentpolyfill-hosts/polyfills/events/grok-bot/dist/watch.mjs" node --test polyfills/events/grok-bot/test/cli.test.mjs
