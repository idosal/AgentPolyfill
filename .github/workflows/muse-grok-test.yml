name: Muse Code and Grok Bot adapters
on:
  push:
    paths: &paths
      - 'polyfills/ard/**'
      - 'polyfills/events/**'
      - 'polyfills/server-cards/**'
      - 'polyfills/skills/**'
      - 'polyfills/tasks/**'
      - 'tools/muse-grok/**'
      - 'docs/muse-grok.md'
      - '.github/workflows/muse-grok-test.yml'
  pull_request:
    paths: *paths
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Install locked dependencies
        run: |
          for dir in skills/codex skills/core tasks/core events/core events/muse ard/codex server-cards/codex server-cards/grok-bot; do
            npm ci --prefix "polyfills/$dir"
          done
      - name: Verify bundles, types and discovery tests
        run: |
          node tools/muse-grok/build.mjs --check
          polyfills/skills/codex/node_modules/.bin/tsc -p tools/muse-grok
          for dir in ard/muse server-cards/muse server-cards/grok-bot; do
            npm --prefix "polyfills/$dir" run typecheck
            npm --prefix "polyfills/$dir" test
          done
      - name: Install the independent Tasks publisher
        run: |
          python3 -m venv "$RUNNER_TEMP/fastmcp"
          "$RUNNER_TEMP/fastmcp/bin/pip" install --quiet --require-hashes -r polyfills/tasks/codex/test/interop/requirements.txt
      - name: Exercise both packaged transports with FastMCP
        run: |
          "$RUNNER_TEMP/fastmcp/bin/python" polyfills/tasks/codex/test/interop/fastmcp_server.py 48763 > "$RUNNER_TEMP/fastmcp.log" 2>&1 &
          publisher=$!
          trap 'kill "$publisher" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            kill -0 "$publisher" || { cat "$RUNNER_TEMP/fastmcp.log"; exit 1; }
            if curl -s -o /dev/null --max-time 1 http://127.0.0.1:48763/mcp; then break; fi
            sleep 1
          done
          MUSE_GROK_FASTMCP_URL=http://127.0.0.1:48763/mcp node --test tools/muse-grok/integration.test.mjs
      - name: Verify the install archive and private team upload
        run: |
          python3 tools/muse-grok/package.py --kit "$RUNNER_TEMP/kit.zip"
          python3 tools/muse-grok/package.py --kit "$RUNNER_TEMP/rebuilt.zip"
          cmp "$RUNNER_TEMP/kit.zip" "$RUNNER_TEMP/rebuilt.zip"
          unzip -q "$RUNNER_TEMP/kit.zip" -d "$RUNNER_TEMP/extracted"
          python3 "$RUNNER_TEMP/extracted/agentpolyfill-hosts/tools/muse-grok/package.py" "$RUNNER_TEMP/team.zip"
          unzip -t "$RUNNER_TEMP/team.zip"
