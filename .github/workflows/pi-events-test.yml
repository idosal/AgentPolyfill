# The Events polyfill for Pi (polyfills/events/pi, extension mcp-events), on any
# change in its folder, in the shared Events client it bundles, in the fixture
# server its tests use, or in the notices tool:
# - its tests in a real Pi (the release in its devDependencies, with its own
#   agent directory and home, and a scripted stand-in model): the user confirms
#   a watch, an event wakes the idle session; what is reached against an HTTP
#   server behind a token and behind OAuth; the committed bundle;
# - a typecheck, and the bundle's third-party notices; on Linux and macOS.

name: "mcp-events (Pi): tests"

on:
  push:
    branches: ["**"]
    paths:
      - "polyfills/events/pi/**"
      - "polyfills/events/core/**"
      - "polyfills/events/claude-code/test/fixture-events-server.ts"
      - "tools/bundle-notices.mjs"
      - ".github/workflows/pi-events-test.yml"
  # Pull requests from forks; a branch of this repository is checked by its
  # pushes (see each job's `if`), so each change runs once.
  pull_request:
    paths:
      - "polyfills/events/pi/**"
      - "polyfills/events/core/**"
      - "polyfills/events/claude-code/test/fixture-events-server.ts"
      - "tools/bundle-notices.mjs"
      - ".github/workflows/pi-events-test.yml"

permissions:
  contents: read

concurrency:
  group: pi-events-test-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: polyfills/events/pi

jobs:
  test:
    name: test (${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      # The shared Events client the extension bundles.
      - run: npm ci
        working-directory: polyfills/events/core
      - run: npm ci
      - run: npm run typecheck
      - name: Third-party notices for the bundle are up to date
        run: node ../../../tools/bundle-notices.mjs . --plugin extension --entry src/index.ts --check
      - run: npm test
