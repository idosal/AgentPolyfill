name: MCP Tasks for Copilot and OpenCode
on:
  push:
    paths:
      - 'polyfills/tasks/**'
      - 'polyfills/events/copilot/src/**'
      - 'polyfills/events/opencode/src/**'
      - 'tools/opencode/**'
      - 'tools/bundle-notices.mjs'
      - '.github/workflows/tasks-host-test.yml'
  pull_request:
    paths:
      - 'polyfills/tasks/**'
      - 'polyfills/events/copilot/src/**'
      - 'polyfills/events/opencode/src/**'
      - 'tools/opencode/**'
      - 'tools/bundle-notices.mjs'
      - '.github/workflows/tasks-host-test.yml'
permissions:
  contents: read
jobs:
  adapter:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      matrix:
        host: [copilot, opencode]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: npm ci --prefix polyfills/tasks/core
      - run: npm ci --prefix polyfills/tasks/${{ matrix.host }}
      - if: matrix.host == 'opencode'
        run: npm ci --prefix tools/opencode
      - run: npm run typecheck --prefix polyfills/tasks/${{ matrix.host }}
      - run: npm run build --prefix polyfills/tasks/${{ matrix.host }}
      - run: git diff --exit-code -- polyfills/tasks/${{ matrix.host }}/plugin
      - if: matrix.host == 'copilot'
        run: node tools/bundle-notices.mjs polyfills/tasks/copilot --plugin plugin --entry src/extension.ts --bundle extensions/mcp-tasks/extension.mjs --check
      - if: matrix.host == 'opencode'
        run: node tools/bundle-notices.mjs polyfills/tasks/opencode --plugin plugin --entry src/server.ts --bundle server.js --check
      - run: npm test --prefix polyfills/tasks/${{ matrix.host }}
