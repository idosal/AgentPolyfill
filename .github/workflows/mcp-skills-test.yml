# The Skills polyfill (polyfills/claude-code/skills, plugin mcp-skills), on
# any change in its folder or in the marketplace file its tests read:
# - the client rules, discovery and the bundled helper (and that it is what
#   src/ builds), with a typecheck and the run against the official
#   TypeScript SDK's Skills server and client, on Linux, macOS and Windows;
# - claude plugin validate and the hooks module's tests (claude plugin test);
# - the model of the skill gate (verification/): the explorer, and TLC on the
#   model in TLA+.

name: "mcp-skills: tests"

on:
  push:
    branches: ["**"]
    paths:
      - "polyfills/claude-code/skills/**"
      - "tools/bundle-notices.mjs"
      - ".claude-plugin/marketplace.json"
      - ".github/workflows/mcp-skills-test.yml"
  # Pull requests from forks; a branch of this repository is checked by its
  # pushes (see each job's `if`), so each change runs once.
  pull_request:
    paths:
      - "polyfills/claude-code/skills/**"
      - "tools/bundle-notices.mjs"
      - ".claude-plugin/marketplace.json"
      - ".github/workflows/mcp-skills-test.yml"

permissions:
  contents: read

concurrency:
  group: mcp-skills-test-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Claude Code release these tests are known to pass with.
  CLAUDE_CODE_VERSION: 2.1.329
  DISABLE_TELEMETRY: "1"
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"

defaults:
  run:
    working-directory: polyfills/claude-code/skills

jobs:
  test:
    name: test (${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - name: Third-party notices for the bundle are up to date
        run: node ../../../tools/bundle-notices.mjs . --check
      - run: npm test
      # The official TypeScript SDK's Skills server and client, over stdio and HTTP.
      - run: npm run interop

  claude:
    name: claude plugin validate and test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Claude Code
        run: npm install -g --no-audit --no-fund "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
      - name: claude plugin validate
        run: claude plugin validate mod
      - name: The hooks module's tests (claude plugin test)
        run: claude plugin test mod

  # The model of the skill gate (verification/, docs/verification.md): the explorer in TypeScript,
  # and TLC on SkillGate.tla (skillGate.qnt in TLA+), exhaustively to each configuration's bound.
  # Two configurations must fail with a counterexample (0.3.0's rule, and the documented
  # read-back limit); a run where they pass would mean the model no longer says anything. TLC is
  # fetched from its release, pinned by SHA-256.
  model:
    name: model of the skill gate (TLC)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    env:
      QUINT: npx --yes @informalsystems/quint@0.34.0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - name: The explorer (every reachable state, 3 and 4 versions)
        run: |
          node --no-warnings verification/model.ts
          node --no-warnings verification/model.ts --versions=4
      - run: $QUINT typecheck verification/skillGate.qnt
      - name: TLC 1.7.4
        run: |
          curl -fsSL -o "$RUNNER_TEMP/tla2tools.jar" https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $RUNNER_TEMP/tla2tools.jar" | sha256sum -c -
      - name: TLC on each configuration, against what it should give
        run: node --no-warnings verification/check.mjs --trace
        env:
          TLA2TOOLS: ${{ runner.temp }}/tla2tools.jar
          JAVA_OPTS: -Xmx4g
          MODEL_STATE_MB: "4000"
      - name: Quint's traces, replayed in the TLA+ model
        run: node verification/conform.mjs
        env:
          TLA2TOOLS: ${{ runner.temp }}/tla2tools.jar
