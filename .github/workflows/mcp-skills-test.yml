# The Skills polyfill (polyfills/claude-code/skills, plugin mcp-skills), on
# any change in its folder or in the marketplace file its tests read:
# - the client rules, discovery and the bundled helper (and that it is what
#   src/ builds), with a typecheck and the run against the official
#   TypeScript SDK's Skills server and client, on Linux, macOS and Windows;
# - claude plugin validate and the hooks module's tests (claude plugin test).

name: "mcp-skills: tests"

on:
  push:
    branches: ["**"]
    paths:
      - "polyfills/claude-code/skills/**"
      - "tools/bundle-notices.mjs"
      - ".claude-plugin/marketplace.json"
      - ".github/workflows/mcp-skills-test.yml"
  # Pull requests from forks; a branch of this repository is checked by its
  # pushes (see each job's `if`), so each change runs once.
  pull_request:
    paths:
      - "polyfills/claude-code/skills/**"
      - "tools/bundle-notices.mjs"
      - ".claude-plugin/marketplace.json"
      - ".github/workflows/mcp-skills-test.yml"

permissions:
  contents: read

concurrency:
  group: mcp-skills-test-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Claude Code release these tests are known to pass with.
  CLAUDE_CODE_VERSION: 2.1.329
  DISABLE_TELEMETRY: "1"
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"

defaults:
  run:
    working-directory: polyfills/claude-code/skills

jobs:
  test:
    name: test (${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - name: Third-party notices for the bundle are up to date
        run: node ../../../tools/bundle-notices.mjs . --check
      - run: npm test
      # The official TypeScript SDK's Skills server and client, over stdio and HTTP.
      - run: npm run interop

  claude:
    name: claude plugin validate and test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Claude Code
        run: npm install -g --no-audit --no-fund "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
      - name: claude plugin validate
        run: claude plugin validate mod
      - name: The hooks module's tests (claude plugin test)
        run: claude plugin test mod

  # The model of the skill gate (verification/, docs/verification.md): the Quint model checked by
  # TLC, exhaustively to the bound written in it, and the explorer in TypeScript. Two instances must
  # fail with a counterexample (0.3.0's rule, and the documented read-back limit); a run where they
  # pass would mean the model no longer says anything.
  model:
    name: model of the skill gate (TLC)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    env:
      QUINT: "@informalsystems/quint@0.34.0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - name: The explorer (every reachable state, 3 and 4 versions)
        run: |
          node --no-warnings verification/model.ts
          node --no-warnings verification/model.ts --versions=4
      - run: npx --yes "$QUINT" typecheck verification/skillGate.qnt
      - name: TLC on the instances that must hold
        run: |
          for m in manifest dynamic; do
            npx --yes "$QUINT" verify verification/skillGate.qnt --main="$m" --backend=tlc --invariants Safety ServerRule
          done
      - name: TLC on the instances that must fail
        run: |
          for m in rule030 lossy; do
            if npx --yes "$QUINT" verify verification/skillGate.qnt --main="$m" --backend=tlc --invariant=Safety; then
              echo "::error::$m should violate Safety"; exit 1
            fi
          done
