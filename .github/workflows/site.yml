# The website (site/): builds it with VitePress and checks every internal link
# and asset. Runs only when the site, or a recording it shows, changes.
# Deploying is done by hand for now (`npm run deploy` in site/).

name: site

on:
  push:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
      - "docs/media/**"
      - "polyfills/claude-code/*/docs/media/**"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
      - "docs/media/**"
      - "polyfills/claude-code/*/docs/media/**"

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      # The Apps recording is a GIF in the repository, encoded as an MP4 for
      # the site, and the Server Cards clip is cut from the launch video.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      # The launch video is not in git: the build downloads it from the release
      # asset named in site/media.json and checks its SHA-256.
      - run: npm run build
      - run: npm run check:links
