# The Events polyfill (polyfills/claude-code/events, plugin mcp-events), on
# any change in its folder or in the marketplace file its tests read:
# - the helper's and the Events client's tests, with a typecheck, on Linux,
#   macOS and Windows;
# - the relay's own tests, in the local Workers runtime;
# - the bundled helper started on Node 20 and on Bun, the runtimes an
#   installed copy may find;
# - claude plugin validate and the hooks module's tests (claude plugin test);
# - the formal models in model/: the Quint models' scenarios and random
#   simulation, TLC on their TLA+ versions (each configuration against what it
#   should give), and Quint's traces replayed in the TLA+ versions.

name: "mcp-events: tests"

on:
  push:
    branches: ["**"]
    paths:
      - "polyfills/claude-code/events/**"
      - "tools/bundle-notices.mjs"
      - ".claude-plugin/marketplace.json"
      - ".github/workflows/mcp-events-test.yml"
  # Pull requests from forks; a branch of this repository is checked by its
  # pushes (see each job's `if`), so each change runs once.
  pull_request:
    paths:
      - "polyfills/claude-code/events/**"
      - "tools/bundle-notices.mjs"
      - ".claude-plugin/marketplace.json"
      - ".github/workflows/mcp-events-test.yml"

permissions:
  contents: read

concurrency:
  group: mcp-events-test-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Claude Code release these tests are known to pass with.
  CLAUDE_CODE_VERSION: 2.1.329
  DISABLE_TELEMETRY: "1"
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"

defaults:
  run:
    working-directory: polyfills/claude-code/events

jobs:
  mod:
    name: mod (${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: npm ci
      # test/relay.e2e-test.ts runs the relay in the local Workers runtime.
      - run: npm ci
        working-directory: polyfills/claude-code/events/mod/relay
      - run: npm run typecheck
      - name: Third-party notices for the bundle are up to date
        run: node ../../../tools/bundle-notices.mjs . --check
      - run: npm test

  relay:
    name: relay (local Workers runtime)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci
        working-directory: polyfills/claude-code/events/mod/relay
      - run: npm test
        working-directory: polyfills/claude-code/events/mod/relay

  runtimes:
    name: the bundle on ${{ matrix.runtime }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [node20, bun]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # The tests are TypeScript run by Node 22; the bundle they start runs on the runtime under test.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: npm ci
      - if: matrix.runtime == 'node20'
        run: |
          curl -fsSL https://nodejs.org/dist/v20.18.0/node-v20.18.0-linux-x64.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "PERF_RUNTIME=$RUNNER_TEMP/node-v20.18.0-linux-x64/bin/node --no-warnings" >> "$GITHUB_ENV"
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - if: matrix.runtime == 'bun'
        run: echo "PERF_RUNTIME=bun" >> "$GITHUB_ENV"
      - name: Start the bundled helper against the fixture server
        run: node --no-warnings test/perf.ts
        env:
          PERF_ONLY: start

  claude:
    name: claude plugin validate and test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Claude Code
        run: npm install -g --no-audit --no-fund "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
      - name: claude plugin validate
        run: claude plugin validate mod
      - name: The hooks module's tests (claude plugin test)
        run: claude plugin test mod

  # The formal models (model/README.md). TLC is fetched from its release, pinned by SHA-256.
  model:
    name: the formal models (Quint, TLC)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    env:
      QUINT: npx --yes @informalsystems/quint@0.34.0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - name: The counterexamples, as scenarios
        run: |
          $QUINT test model/delivery.qnt --backend typescript --max-samples 200
          $QUINT test model/wake.qnt --backend typescript --max-samples 200
          $QUINT test model/relay.qnt --backend typescript --max-samples 200
      # Random simulation: it samples executions, it does not prove anything.
      - name: The invariants, by simulation
        run: |
          for init in poll push webhook; do $QUINT run model/delivery.qnt --init $init --invariant Safety --max-samples 5000 --max-steps 60 --backend typescript; done
          $QUINT run model/delivery.qnt --init webhookEvilRelay --invariant AtMostOnce --max-samples 5000 --max-steps 60 --backend typescript
          $QUINT run model/delivery.qnt --init webhookEvilRelay --invariant NothingForged --max-samples 5000 --max-steps 60 --backend typescript
          $QUINT run model/wake.qnt --init init --invariant Kept --max-samples 10000 --max-steps 40 --backend typescript
          $QUINT run model/relay.qnt --init init --invariant NoCrossRefusal --max-samples 5000 --max-steps 30 --backend typescript
          $QUINT run model/relay.qnt --init migrating --invariant NoCrossRefusalAtOwn --max-samples 5000 --max-steps 30 --backend typescript
      - name: TLC 1.7.4
        run: |
          curl -fsSL -o "$RUNNER_TEMP/tla2tools.jar" https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $RUNNER_TEMP/tla2tools.jar" | sha256sum -c -
      # Every state within each configuration's bounds: what holds, the 0.4.1 defects found
      # again, and what TLC found on 0.5.0's models (model/README.md).
      - name: The invariants, by model checking (TLC)
        run: node model/check.mjs --trace
        env:
          TLA2TOOLS: ${{ runner.temp }}/tla2tools.jar
          JAVA_OPTS: -Xmx4g
          MODEL_STATE_MB: "4000"
      - name: Quint's traces, replayed in the TLA+ models
        run: node model/conform.mjs
        env:
          TLA2TOOLS: ${{ runner.temp }}/tla2tools.jar
