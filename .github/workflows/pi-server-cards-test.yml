# The Server Cards polyfill for Pi (polyfills/server-cards/pi, extension
# mcp-server-cards), on any change in its folder or in the shared Server Cards
# modules it bundles (polyfills/server-cards/claude-code/mod/hooks):
# - its tests: the adapter's checks and wording, the network bounds, and a real
#   Pi (the release in its devDependencies, with its own agent directory and
#   home, and a scripted stand-in model) adding a server with pi mcp add after
#   the user says yes, and writing nothing after a no or where nobody can be
#   asked; the committed bundle; with a typecheck, on Linux and macOS.

name: "mcp-server-cards (Pi): tests"

on:
  push:
    branches: ["**"]
    paths:
      - "polyfills/server-cards/pi/**"
      - "polyfills/server-cards/claude-code/mod/hooks/**"
      - "polyfills/server-cards/codex/src/fetch.ts"
      - ".github/workflows/pi-server-cards-test.yml"
  # Pull requests from forks; a branch of this repository is checked by its
  # pushes (see each job's `if`), so each change runs once.
  pull_request:
    paths:
      - "polyfills/server-cards/pi/**"
      - "polyfills/server-cards/claude-code/mod/hooks/**"
      - "polyfills/server-cards/codex/src/fetch.ts"
      - ".github/workflows/pi-server-cards-test.yml"

permissions:
  contents: read

concurrency:
  group: pi-server-cards-test-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: polyfills/server-cards/pi

jobs:
  test:
    name: test (${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
