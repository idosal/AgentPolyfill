name: Pi MCP Tasks
on:
  push:
    paths:
      - 'polyfills/tasks/**'
      - 'polyfills/events/pi/**'
      - 'tools/bundle-notices.mjs'
      - '.github/workflows/pi-tasks-test.yml'
  pull_request:
    paths:
      - 'polyfills/tasks/**'
      - 'polyfills/events/pi/**'
      - 'tools/bundle-notices.mjs'
      - '.github/workflows/pi-tasks-test.yml'
permissions:
  contents: read
jobs:
  pi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: npm ci --prefix polyfills/tasks/core
      - run: npm ci --prefix polyfills/events/pi
      - run: npm ci --prefix polyfills/tasks/pi
      - run: npm run typecheck --prefix polyfills/tasks/pi
      - run: node tools/bundle-notices.mjs polyfills/tasks/pi --plugin extension --entry src/index.ts --check
      - name: Install the independent Tasks test server
        run: |
          python3 -m venv "$RUNNER_TEMP/fastmcp"
          "$RUNNER_TEMP/fastmcp/bin/python" -m pip install --quiet --require-hashes \
            -r polyfills/tasks/codex/test/interop/requirements.txt
      - name: Check the packaged extension in isolated Pi sessions
        run: |
          test_root=$(mktemp -d)
          trap 'rm -rf "$test_root"' EXIT
          mkdir -p "$test_root/bin" "$test_root/home" "$test_root/tmp" "$test_root/config" "$test_root/data" "$test_root/cache" "$test_root/state"
          ln -s "$(command -v node)" "$test_root/bin/node"
          cd polyfills/tasks/pi
          env -i HOME="$test_root/home" TMPDIR="$test_root/tmp" PATH="$test_root/bin" \
            XDG_CONFIG_HOME="$test_root/config" XDG_DATA_HOME="$test_root/data" \
            XDG_CACHE_HOME="$test_root/cache" XDG_STATE_HOME="$test_root/state" \
            node --test --no-warnings --test-concurrency=1 'test/*-test.ts'
          env -i HOME="$test_root/home" TMPDIR="$test_root/tmp" PATH="$test_root/bin" \
            XDG_CONFIG_HOME="$test_root/config" XDG_DATA_HOME="$test_root/data" \
            XDG_CACHE_HOME="$test_root/cache" XDG_STATE_HOME="$test_root/state" \
            MCP_TASKS_INTEROP_PYTHON="$RUNNER_TEMP/fastmcp/bin/python" \
            node --test --no-warnings test/interop/fastmcp-test.ts
