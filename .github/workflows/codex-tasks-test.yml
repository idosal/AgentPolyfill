# The Tasks polyfill for Codex (polyfills/tasks/codex), with the shared Tasks client it bundles
# (polyfills/tasks/core), on any change in either folder:
# - the helper's tests (the MCP server Codex starts, config.toml, consent, polling, the wake,
#   input_required, stand-down, the client rules one by one, over stdio and HTTP, the committed
#   bundle and its notices), with a typecheck, on Linux and macOS;
# - the interop run against FastMCP with fastmcp-tasks (SEP-2663), a server whose Tasks side
#   someone else wrote, installed from a lock file with every hash;
# - the bundled helper started on Node 20, the oldest it supports;
# - Codex itself installing the plugin into a throwaway CODEX_HOME and seeing its MCP server.

name: "mcp-tasks for Codex: tests"

on:
  push:
    branches: ["**"]
    paths:
      - "polyfills/tasks/**"
      - ".agents/plugins/marketplace.json"
      - "tools/bundle-notices.mjs"
      - ".github/workflows/codex-tasks-test.yml"
  # Pull requests from forks; a branch of this repository is checked by its
  # pushes (see each job's `if`), so each change runs once.
  pull_request:
    paths:
      - "polyfills/tasks/**"
      - ".agents/plugins/marketplace.json"
      - "tools/bundle-notices.mjs"
      - ".github/workflows/codex-tasks-test.yml"

permissions:
  contents: read

concurrency:
  group: codex-tasks-test-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Codex release the plugin was tested live with.
  CODEX_VERSION: 0.172.0
  # Node 20's tarball, checked against the hash nodejs.org publishes for it (SHASUMS256.txt).
  NODE20_SHA256: 4543670b589593f8fa5f106111fd5139081da42bb165a9239f05195e405f240a

defaults:
  run:
    working-directory: polyfills/tasks/codex

jobs:
  helper:
    name: helper (${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: npm ci
        working-directory: polyfills/tasks/core
      - run: npm ci
      - run: npm run typecheck
      - name: Third-party notices for the bundle are up to date
        run: node ../../../tools/bundle-notices.mjs . --plugin plugin --check
      - run: npm test

  interop:
    name: interop with FastMCP
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: npm ci
        working-directory: polyfills/tasks/core
      - run: npm ci
      - name: FastMCP with fastmcp-tasks, in a venv of its own, every package pinned with its hash
        run: |
          python3 -m venv "$RUNNER_TEMP/fastmcp"
          "$RUNNER_TEMP/fastmcp/bin/pip" install --quiet --require-hashes -r test/interop/requirements.txt
      - run: npm run interop
        env:
          MCP_TASKS_INTEROP_PYTHON: ${{ runner.temp }}/fastmcp/bin/python

  node20:
    name: the bundle on Node 20
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Start plugin/dist/helper.js on Node 20, list its tools and call one
        run: |
          curl -fsSL -o "$RUNNER_TEMP/node20.tar.xz" https://nodejs.org/dist/v20.18.0/node-v20.18.0-linux-x64.tar.xz
          echo "$NODE20_SHA256  $RUNNER_TEMP/node20.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/node20.tar.xz" -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/codex-home"
          { printf '%s\n' \
              '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{"elicitation":{}},"clientInfo":{"name":"ci","version":"0"}}}' \
              '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
              '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"list_task_servers","arguments":{},"_meta":{"threadId":"01a21395-0000-4000-8000-000000000000"}}}'
            sleep 5; } \
            | CODEX_HOME="$RUNNER_TEMP/codex-home" MCP_TASKS_STATE="$RUNNER_TEMP/state" "$RUNNER_TEMP/node-v20.18.0-linux-x64/bin/node" plugin/dist/helper.js > "$RUNNER_TEMP/out.jsonl"
          cat "$RUNNER_TEMP/out.jsonl"
          grep -q '"protocolVersion":"2025-06-18"' "$RUNNER_TEMP/out.jsonl"
          grep -q '"name":"start_task"' "$RUNNER_TEMP/out.jsonl"
          grep -q 'None of your MCP servers offers the Tasks extension' "$RUNNER_TEMP/out.jsonl"

  codex:
    name: codex plugin add, from the AgentPolyfill marketplace
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      # Codex at the tested version. npm installs it with no lockfile of ours: its own dependencies
      # are whatever that release names.
      - name: Codex
        run: npm install -g --no-audit --no-fund "@openai/codex@$CODEX_VERSION"
      - name: Install the plugin into a throwaway CODEX_HOME, and see its server
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
        run: |
          mkdir -p "$CODEX_HOME"
          codex plugin marketplace add "$GITHUB_WORKSPACE"
          codex plugin add mcp-tasks@agent-polyfill
          codex mcp list | tee "$RUNNER_TEMP/mcp.txt"
          grep -q 'mcp-tasks' "$RUNNER_TEMP/mcp.txt"
          grep -q 'dist/helper.js' "$RUNNER_TEMP/mcp.txt"
