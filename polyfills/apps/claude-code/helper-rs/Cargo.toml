[package]
name = "mcp-apps-cli-helper"
description = "The mcp-apps-cli helper, in Rust: hosts MCP App views in headless Chrome (see PORT.md)"
license = "Apache-2.0"
publish = false
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/render", "crates/pictures"]

[dependencies]
anyhow = "1.0.104"
hex = "0.4.3"
libc = "0.2.191"
rmcp = { version = "3.11.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
reqwest = { version = "0.13", default-features = false }
http = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "time", "sync", "fs", "signal"] }
base64 = "0.23.1"
url = "2.5.8"
mcp-apps-render = { version = "0.1.0", path = "crates/render" }
mcp-apps-pictures = { version = "0.1.0", path = "crates/pictures" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# TLS for MCP servers over HTTPS: rustls on macOS and Linux (no system
# library to link); Windows' own (Schannel) there, which needs no C build.
[target.'cfg(not(windows))'.dependencies]
rmcp = { version = "3.11.0", default-features = false, features = ["reqwest"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[target.'cfg(windows)'.dependencies]
rmcp = { version = "3.11.0", default-features = false, features = ["reqwest-native-tls"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_Security_Cryptography"] }
