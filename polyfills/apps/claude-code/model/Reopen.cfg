\* Two views, one live at a time, each opened up to twice (a reopen, or a
\* wake): eviction and reopening together.
SPECIFICATION Spec
CONSTANTS
    Servers = {"s1", "s2"}
    Calls = {"c1", "c2"}
    CallServer <- MCCallServer
    LiveMax = 1
    MaxOpens = 2
    Remote = {"s1"}
    FixRecheck = TRUE
    FixOrder = TRUE
    FixAtSend = TRUE
    FixRevoke = TRUE
    FixGen = TRUE
    Fickle = FALSE
    AppTraffic = FALSE
    Others = FALSE
INVARIANTS
    TypeOK
    AtMostLiveMax
    NoOrphanPages
    NoDeadViews
    OwnServerOnly
