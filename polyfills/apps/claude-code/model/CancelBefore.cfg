\* TrafficShared.cfg with every 0.1.3 fix but the cancelling (FixRevoke).
\* Expected: NoAnswerAfterNo violated (an answer in flight when the mod hears
\* the no still reaches the app).
SPECIFICATION Spec
CONSTANTS
    Servers = {"s1", "s2"}
    Calls = {"c1", "c3"}
    CallServer <- MCCallServer
    LiveMax = 2
    MaxOpens = 1
    Remote = {"s1"}
    FixRecheck = TRUE
    FixOrder = TRUE
    FixAtSend = TRUE
    FixRevoke = FALSE
    FixGen = TRUE
    Fickle = TRUE
    AppTraffic = TRUE
    Others = FALSE
INVARIANTS
    TypeOK
    NoAnswerAfterNo
