\* Race.cfg with generations but without the one-at-a-time order of /open and
\* /close. Expected: NoDeadViews violated (a late /open of an earlier
\* generation replaces the newer page, and its /close then closes it).
SPECIFICATION Spec
CONSTANTS
    Servers = {"s1", "s2"}
    Calls = {"c1"}
    CallServer <- MCCallServer
    LiveMax = 1
    MaxOpens = 3
    Remote = {"s1"}
    FixRecheck = TRUE
    FixOrder = FALSE
    FixAtSend = TRUE
    FixRevoke = TRUE
    FixGen = TRUE
    Fickle = FALSE
    AppTraffic = FALSE
    Others = FALSE
INVARIANTS
    TypeOK
    NoOrphanPages
    NoDeadViews
