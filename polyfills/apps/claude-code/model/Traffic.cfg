\* Two views on two servers, one live at a time, every kind of app request,
\* Claude Code starting and stopping its use of either server at any time.
\* 0.1.3: every request the helper writes waits for its own verdict, and a no
\* cancels what is in flight.
SPECIFICATION Spec
CONSTANTS
    Servers = {"s1", "s2"}
    Calls = {"c1", "c2"}
    CallServer <- MCCallServer
    LiveMax = 1
    MaxOpens = 1
    Remote = {"s1"}
    FixRecheck = TRUE
    FixOrder = TRUE
    FixAtSend = TRUE
    FixRevoke = TRUE
    FixGen = TRUE
    Fickle = TRUE
    AppTraffic = TRUE
    Others = FALSE
INVARIANTS
    TypeOK
    GatedSends
    NoSendAfterNo
    SendsOnlyWhileUsed
    NoAnswerAfterNo
    NoCredentialToRemote
    OwnServerOnly
    AtMostLiveMax
