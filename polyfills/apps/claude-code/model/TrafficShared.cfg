\* Two views of one server, both live, every kind of app request, Claude Code
\* starting and stopping its use of the server: the mod may hear a no through
\* either view. 0.1.3.
SPECIFICATION Spec
CONSTANTS
    Servers = {"s1", "s2"}
    Calls = {"c1", "c3"}
    CallServer <- MCCallServer
    LiveMax = 2
    MaxOpens = 1
    Remote = {"s1"}
    FixRecheck = TRUE
    FixOrder = TRUE
    FixAtSend = TRUE
    FixRevoke = TRUE
    FixGen = TRUE
    Fickle = TRUE
    AppTraffic = TRUE
    Others = FALSE
INVARIANTS
    TypeOK
    GatedSends
    NoSendAfterNo
    SendsOnlyWhileUsed
    NoAnswerAfterNo
    NoCredentialToRemote
    OwnServerOnly
    AtMostLiveMax
