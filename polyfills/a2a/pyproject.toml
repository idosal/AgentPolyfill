[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentpolyfill-a2a-tasks"
version = "0.1.0"
description = "AgentPolyfill A2A delegation for interactive agent hosts"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = ["Private :: Do Not Upload"]
dependencies = ["a2a-sdk==1.3.1", "httpx>=0.28,<1", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
setup = ["ruamel.yaml>=0.18.16,<0.19", "tomlkit>=0.13,<1"]

[project.scripts]
agentpolyfill-a2a = "agentpolyfill_a2a.server:main"

[tool.setuptools]
packages = ["agentpolyfill_a2a"]
