name: mcp-events
version: "0.2.0"
description: >-
  MCP Events (SEP-3415) by webhook, push and poll: watch events on your MCP servers, and an event
  wakes the idle session that asked for it. Servers with events: true use native Hermes delivery.
author: Ido Salomon
provides_tools:
  - list_event_types
  - watch_event
  - unwatch_event
  - list_watches
  - get_event
  - recent_events
provides_hooks:
  - pre_tool_call
  - pre_llm_call
  - on_session_open
