\* mcp-events for Codex 0.1.2: the clock from 0 to 16 (fifteen minutes a unit: four hours), an hour
\* of four, a gap of one, two wakes an hour, the pause lifting after an hour, at most three events
\* waiting (wakeCodex.qnt's bounds, with the clock and the events longer); a session codex queue
\* reaches, and one it cannot; the helper dying, events arriving and calls from every kind of turn
\* at any time. Expected: all five hold. (WithinHour and Gap: WakeCodexHour, WakeCodexGap, WakeCodexHeard.)
SPECIFICATION Spec
CONSTANTS
    ALLOW = TRUE
    LIFT = 4
    MAX_TIME = 16
    HOUR = 4
    GAP = 1
    PER_HOUR = 2
    PENDING = 3
VIEW ViewQuiet
INVARIANTS
    OnlyThePerson
    QuietAfterNotice
    OneNotice
    NoWakeUnwakeable
    NothingLost
