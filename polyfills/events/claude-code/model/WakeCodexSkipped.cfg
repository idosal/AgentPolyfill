\* 0.1.3, as WakeCodexHour. Expected: NothingLost violated, as documented: delivery is at most once,
\* so a batch handed to codex queue that the helper never heard back about (it ended, or codex queue
\* timed out) counts as handed over, and if Codex had not taken it, no wake announces it; its events
\* are still stored (unannouncedTest, unknownSkippedTest). OnlyUnheardSkipped, in WakeCodexKept,
\* holds: no other step skips one.
SPECIFICATION Spec
CONSTANTS
    ALLOW = TRUE
    LIFT = 4
    RECORD = TRUE
    MAX_TIME = 10
    HOUR = 4
    GAP = 1
    PER_HOUR = 2
    PENDING = 2
VIEW ViewQuiet
INVARIANTS
    NothingLost
