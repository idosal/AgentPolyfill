\* mcp-events for Codex 0.1.3, as WakeCodexKept with the clock from 0 to 16 (four hours) and at most
\* three events waiting, the helper dying between any two steps. The view leaves out shown and spoke
\* (ViewQuiet), so WithinHour and Gap, which read them, are WakeCodexKept's. Expected: the other
\* eight hold.
SPECIFICATION Spec
CONSTANTS
    ALLOW = TRUE
    LIFT = 4
    RECORD = TRUE
    MAX_TIME = 16
    HOUR = 4
    GAP = 1
    PER_HOUR = 2
    PENDING = 3
VIEW ViewQuiet
INVARIANTS
    OnlyThePerson
    QuietAfterNotice
    OneNotice
    NoWakeUnwakeable
    Stored
    AtMostOnce
    NoStalePause
    OnlyUnheardSkipped
