\* 0.5.1, webhook through a relay that lies about when deliveries arrived and hands them over
\* in any order: 1 event, the clock from 0 to 2, 1 session, at most 2 deliveries at the relay.
\* Expected: all hold. (NoAckBeforeStore and CursorSafe assume an honest relay.)
SPECIFICATION Spec
CONSTANTS
    N = 1
    MAX_TIME = 2
    FRESH = 1
    SLACK = 2
    MAX_SESSIONS = 1
    MAX_SEQ = 2
    FIX = TRUE
    MODES = {"webhook"}
    EVILS = {TRUE}
VIEW View
INVARIANTS
    AtMostOnce
    NothingForged
    NoneStranded
