\* mcp-events for Hermes 0.1.0: the clock from 0 to 12 (three hours: the pause lifts twice), an
\* hour of four, a gap of one, two wakes an hour, the pause lifting after an hour, at most two
\* events waiting; the gateway stopping between any two steps, the plugin not answering, refusing
\* and taking; the only turns besides the person's are the plugin's own wakes. Expected: all hold.
SPECIFICATION Spec
CONSTANTS
    LIFT = 4
    RECORD = TRUE
    OTHERS = {"ours"}
    DROPS = FALSE
    MAX_TIME = 12
    HOUR = 4
    GAP = 1
    PER_HOUR = 2
    PENDING = 2
VIEW View
INVARIANTS
    WithinHour
    Gap
    OnlyThePerson
    QuietAfterNotice
    OneNotice
    Stored
    AtMostOnce
    NoStalePause
    OnlyUnheardSkipped
