<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deploys</title>
<style>
  :root { color-scheme: dark; --bg: #0f1115; --panel: #171a21; --line: #262b36; --text: #e8eaf0; --dim: #8d95a5; --ok: #3fb97a; --bad: #ef5d5d; --run: #e0a93a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 28px 20px 40px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  p.sub { margin: 0 0 22px; color: var(--dim); font-size: 14px; }
  .services { display: grid; gap: 10px; margin-bottom: 26px; }
  .service { display: flex; align-items: center; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .service .name { font: 600 16px ui-monospace, "SF Mono", Menlo, monospace; flex: 1; }
  button { font: inherit; font-size: 14px; font-weight: 600; border-radius: 8px; border: 1px solid var(--line); background: #222734; color: var(--text); padding: 7px 13px; cursor: pointer; }
  button:hover { background: #2b3141; }
  button.bad { color: #ffb4b4; border-color: #51303a; background: #2a1b22; }
  button.bad:hover { background: #36222b; }
  button { transition: box-shadow .18s ease, transform .12s ease; }
  button.pressed { transform: scale(.96); box-shadow: 0 0 0 3px rgba(120, 160, 255, .55); }
  button.bad.pressed { box-shadow: 0 0 0 3px rgba(239, 93, 93, .6); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); margin: 0 0 10px; font-weight: 600; }
  .deploy { display: grid; grid-template-columns: 64px 76px 84px 1fr auto; gap: 12px; align-items: center; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); margin-bottom: 8px; font-size: 14px; }
  .deploy .id, .deploy .commit { font-family: ui-monospace, "SF Mono", Menlo, monospace; color: var(--dim); }
  .deploy .svc { font: 600 14px ui-monospace, "SF Mono", Menlo, monospace; }
  .deploy .last { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
  .pill.ok { background: #143326; color: var(--ok); }
  .pill.failed { background: #3a1a1e; color: var(--bad); }
  .pill.running { background: #3a2f14; color: var(--run); }
  .empty { color: var(--dim); font-size: 14px; padding: 14px; border: 1px dashed var(--line); border-radius: 10px; }
</style>
</head>
<body>
<main>
  <h1>Deploys</h1>
  <p class="sub">A demo service. Each finished deploy is reported to MCP clients as a <code>deploy.finished</code> event.</p>
  <section class="services" id="services"></section>
  <h2>Recent</h2>
  <section id="deploys"><div class="empty">No deploys yet.</div></section>
</main>
<script>
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
  document.addEventListener('pointerdown', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    b.classList.add('pressed');
    setTimeout(() => b.classList.remove('pressed'), 420);
  });
  async function deploy(service, fail) {
    await fetch('/api/deploy', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ service, fail }) });
    refresh();
  }
  let drawn = false;
  async function refresh() {
    const { services, deploys } = await (await fetch('/api/deploys')).json();
    if (!drawn) {
      drawn = true;
      const box = document.getElementById('services');
      for (const s of services) {
        const row = el('div', 'service');
        row.append(el('span', 'name', s));
        const good = el('button', '', 'Deploy'); good.onclick = () => deploy(s, false); good.dataset.deploy = s + ':ok';
        const bad = el('button', 'bad', 'Deploy a bad commit'); bad.onclick = () => deploy(s, true); bad.dataset.deploy = s + ':bad';
        row.append(good, bad);
        box.append(row);
      }
    }
    const list = document.getElementById('deploys');
    if (!deploys.length) return;
    list.replaceChildren(...deploys.map((d) => {
      const row = el('div', 'deploy');
      row.append(el('span', 'id', d.id), el('span', 'svc', d.service), el('span', 'commit', d.commit), el('span', 'last', d.log[0] ?? 'Starting'), el('span', 'pill ' + d.status, d.status));
      return row;
    }));
  }
  refresh();
  setInterval(refresh, 500);
</script>
</body>
</html>
