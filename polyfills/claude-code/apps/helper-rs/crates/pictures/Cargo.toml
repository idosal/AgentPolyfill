[package]
name = "mcp-apps-pictures"
description = "The picture encoders of the mcp-apps-cli helper: PNG decoding, the 256-colour quantizer and iTerm2 strips (a port of mod/helper/png.mjs, quantize.mjs, strips.mjs)"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
png = "0.18"
flate2 = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
