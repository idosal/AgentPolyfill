\* Four views, at most three live: eviction as views open, with crashes,
\* closes and /clear. Each opened once. All on one server, checked up to symmetry.
SPECIFICATION Spec
CONSTANTS
    Servers = {"s1", "s2"}
    Calls = {c1, c2, c3, c4}
    CallServer <- MCCallServer
    LiveMax = 3
    MaxOpens = 1
    Remote = {"s1"}
    FixRecheck = TRUE
    FixOrder = TRUE
    Fickle = FALSE
    AppTraffic = FALSE
    Others = FALSE
SYMMETRY CallPerms
INVARIANTS
    TypeOK
    AtMostLiveMax
    NoOrphanPages
    NoDeadViews
