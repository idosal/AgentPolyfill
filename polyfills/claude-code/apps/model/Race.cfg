    LiveMax = 1
    MaxOpens = 3
    Remote = {"s1"}
    FixRecheck = TRUE
    FixOrder = TRUE
    Fickle = FALSE
    AppTraffic = FALSE
    Others = FALSE
INVARIANTS
    TypeOK
    NoOrphanPages
    NoDeadViews
