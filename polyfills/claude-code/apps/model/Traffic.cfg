\* Two views on two servers, one live at a time, every kind of app request,
\* Claude Code starting and stopping its use of either server at any time.
\* 0.1.2: an app's own traffic waits for a fresh verdict.
SPECIFICATION Spec
CONSTANTS
    Servers = {"s1", "s2"}
    Calls = {"c1", "c2"}
    CallServer <- MCCallServer
    LiveMax = 1
    MaxOpens = 1
    Remote = {"s1"}
    FixRecheck = TRUE
    FixOrder = TRUE
    Fickle = TRUE
    AppTraffic = TRUE
    Others = FALSE
INVARIANTS
    TypeOK
    GatedSends
    NoSendAfterNo
    NoCredentialToRemote
    OwnServerOnly
    AtMostLiveMax
